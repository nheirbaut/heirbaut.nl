name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HUGO_VERSION: "0.152.2"
  GO_VERSION: "1.23.4"
  HTMLTEST_VERSION: "0.17.0"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          rm -f /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          go version

      - name: Install Hugo extended (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" -o /tmp/hugo_checksums.txt
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o "/tmp/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          grep "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" /tmp/hugo_checksums.txt > /tmp/hugo_sha256.txt
          (cd /tmp && sha256sum -c /tmp/hugo_sha256.txt)
          sudo tar -C /usr/local/bin -xzf "/tmp/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          rm -f /tmp/hugo_checksums.txt "/tmp/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" /tmp/hugo_sha256.txt
          hugo version

      - name: Install htmltest (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz" -o /tmp/htmltest.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/htmltest.tgz htmltest
          rm -f /tmp/htmltest.tgz
          htmltest --version

      - name: Build (Hugo)
        shell: bash
        run: |
          set -euo pipefail
          hugo --minify

      - name: HTML/link checks (htmltest)
        shell: bash
        run: |
          set -euo pipefail
          htmltest

      - name: Upload build artifact (public/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          if-no-files-found: error
