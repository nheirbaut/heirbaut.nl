name: Deploy (GitHub Pages)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.152.2"
  GO_VERSION: "1.23.4"

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Go (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          rm -f /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          go version

      - name: Install Hugo extended (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" -o /tmp/hugo_checksums.txt
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o "/tmp/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          grep "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" /tmp/hugo_checksums.txt > /tmp/hugo_sha256.txt
          (cd /tmp && sha256sum -c /tmp/hugo_sha256.txt)
          sudo tar -C /usr/local/bin -xzf "/tmp/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          rm -f /tmp/hugo_checksums.txt "/tmp/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" /tmp/hugo_sha256.txt
          hugo version

      - name: Build (Hugo)
        shell: bash
        run: |
          set -euo pipefail
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
