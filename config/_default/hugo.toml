baseURL = "https://www.heirbaut.nl/"
languageCode = "nl"
defaultContentLanguage = "nl"

title = "heirbaut.nl"

[pagination]
  pagerSize = 12

enableRobotsTXT = true

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/posts/:slug/"

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v2"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
